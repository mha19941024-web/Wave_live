name: Deploy Wave Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Check Worker files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== WORKER FILES ====="
          pwd
          ls -la

          echo ""
          echo "===== REQUIRED FILES ====="

          test -f src/index.ts
          test -f wrangler.toml

          echo "OK src/index.ts"
          echo "OK wrangler.toml"

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo "===== DEPLOYING WAVE WORKER ====="

          npx --yes wrangler@latest deploy

          echo ""
          echo "===== WAVE WORKER DEPLOYED ====="
