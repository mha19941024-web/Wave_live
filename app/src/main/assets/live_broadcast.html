<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#000;height:100%;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#s{position:fixed;top:15px;left:15px;right:15px;background:#000a;color:#fff;padding:10px;border-radius:10px;z-index:2}button{position:fixed;bottom:20px;left:20px;right:20px;padding:15px;z-index:2}</style><div id=s>Starting LIVE…</div><video id=v autoplay muted playsinline></video><button id=e>END LIVE</button><script>const url="__PUBLISH_URL__";let pc,st;(async()=>{try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:true});v.srcObject=st;pc=new RTCPeerConnection();st.getTracks().forEach(t=>pc.addTrack(t,st));let o=await pc.createOffer();await pc.setLocalDescription(o);let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/sdp"},body:o.sdp});if(!r.ok)throw Error("Publish failed "+r.status);await pc.setRemoteDescription({type:"answer",sdp:await r.text()});s.textContent="● LIVE"}catch(x){s.textContent="LIVE error: "+x.message}})();e.onclick=()=>{st?.getTracks().forEach(t=>t.stop());pc?.close();location.href="vyro://live/stop"};</script>
