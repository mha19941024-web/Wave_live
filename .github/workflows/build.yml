name: Build Wave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960c1eaa6b7d4c6b2a0c5f4e8d2f0b8e8f4b

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'

      - name: Check project
        run: |
          echo "=== PROJECT ROOT ==="
          ls -la

          echo "=== GRADLE FILES ==="
          find . -maxdepth 5 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \)

      - name: Build APK
        run: |
          if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -f "./app/build.gradle" ] || [ -f "./app/build.gradle.kts" ]; then
            gradle -p . assembleDebug
          else
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
