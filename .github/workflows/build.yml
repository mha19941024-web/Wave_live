name: Build Wave

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Check Java
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ROOT ====="
          ls -la

          echo ""
          echo "===== REQUIRED FILES ====="

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "===== REQUIRED FILES ARE MISSING ====="
            exit 1
          fi

          echo ""
          echo "===== ALL REQUIRED FILES EXIST ====="

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.9"
          GRADLE_DIR="$HOME/gradle"

          echo "===== DOWNLOADING GRADLE ${GRADLE_VERSION} ====="

          mkdir -p "$GRADLE_DIR"

          curl -fL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_DIR/gradle.zip"

          unzip -q -o \
            "$GRADLE_DIR/gradle.zip" \
            -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo ""
          echo "===== GRADLE VERSION ====="

          "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILDING WAVE LIVE APK ====="

          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== CHECKING APK ====="

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND:"
            echo "$APK"
            exit 1
          fi

          echo ""
          echo "===== APK CREATED SUCCESSFULLY ====="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-Live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
