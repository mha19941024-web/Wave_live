name: Build Wave APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9

        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build Wave
        run: |
          WRAPPER=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found."
            echo "The Android project is incomplete or uploaded inside another folder."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Gradle project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
