name: Build Wave

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          echo "===== ROOT ====="
          ls -la

          echo "===== REQUIRED FILES ====="

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "===== REQUIRED FILES ARE MISSING ====="
            exit 1
          fi

          echo "===== ALL REQUIRED FILES EXIST ====="

      - name: Set up JDK 17
        uses: actions/setup-java@4d7e8ed3d6f2f1e8a1e8d6e4a0c7f5c8d3b2a1f0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d3e8c2e8f3b7e3c1d5a5f0a2d9
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILDING WAVE LIVE APK ====="

          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND: $APK"
            exit 1
          fi

          echo "===== APK CREATED SUCCESSFULLY ====="
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-Live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
