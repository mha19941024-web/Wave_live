name: Build Wave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Wave APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check project files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          if [ -d app ]; then
            ls -la app
          else
            echo "ERROR: app folder is missing"
            exit 1
          fi

      - name: Make Gradle executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew is missing from repository root"
            exit 1
          fi

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wave-Live-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
