name: Build Wave

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Show project files
        shell: bash
        run: |
          set -u

          echo "===== ROOT ====="
          pwd
          ls -la

          echo ""
          echo "===== GRADLE ====="
          find gradle -maxdepth 3 -type f -print 2>/dev/null || true

          echo ""
          echo "===== APP ====="
          find app -maxdepth 5 -type f -print 2>/dev/null | head -200 || true

          echo ""
          echo "===== REQUIRED FILES ====="

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.properties"
            "gradle/wrapper/gradle-wrapper.jar"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )

          missing=0

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          echo ""
          if [ "$missing" -ne 0 ]; then
            echo "===== ONE OR MORE REQUIRED FILES ARE MISSING ====="
            exit 1
          fi

          echo "===== ALL REQUIRED FILES EXIST ====="

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND: $APK"
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"
