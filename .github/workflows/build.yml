name: Build Wave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@c5195efecf7bdfc987ee8bae7a71cb8b11521c00

      - name: Set up Java 17
        uses: actions/setup-java@7a445c4e3e4f4c3b2c3f6c6c5c5d0e0e4e6c4f4f
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d8f0f6e5d7c3b1f4f0b0b8b0e0
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-Live-APK
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
