name: Build Wave Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@019fce9d5a7c4f7d8b8c7c8e6b8e8b8f8b8e8b8e
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java version
        run: java -version

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$HOME/gradle/gradle-8.9/bin/gradle" --version

      - name: Check project
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradlew
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/vyro/app/MainActivity.kt
          echo "Wave Live project files OK"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-Live-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
