name: Build Wave Live

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Set up Java 17
        uses: actions/setup-java@17a2a9e1f4c9e8b1d3f6f0a3b9e5b6a7c8d9e0f1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "gradlew"
            "gradle/wrapper/gradle-wrapper.jar"
            "gradle/wrapper/gradle-wrapper.properties"
          )

          missing=0

          echo "===== PROJECT FILE CHECK ====="

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "OK      $file"
            else
              echo "MISSING $file"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Required project files are missing."
            exit 1
          fi

          chmod +x gradlew

      - name: Show Java and Gradle versions
        shell: bash
        run: |
          set -euo pipefail

          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          ./gradlew --version

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          echo "===== BUILDING WAVE LIVE ====="

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "===== VERIFY APK ====="

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Wave-Live-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
