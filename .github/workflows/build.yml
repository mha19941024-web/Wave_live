name: Build Wave APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \)

      - name: Build APK
        run: |
          if [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -f "./app/build.gradle" ] || [ -f "./app/build.gradle.kts" ]; then
            gradle -p . assembleDebug
          else
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wave-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
