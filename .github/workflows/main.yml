name: Wave Live APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Wave project
        run: |
          set -e
          unzip -q Wave-Live-0.9.0-GitHub-Ready-FIXED.zip -d /tmp/wave
          ROOT=$(find /tmp/wave -maxdepth 1 -type d -name 'VYRO-Wave-commercial-0.9.0' | head -n 1)
          cp -a "$ROOT"/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-live-apk
          path: app/build/outputs/apk/debug/*.apk
