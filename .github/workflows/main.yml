name: Wave Live APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Unpack Wave project
        run: |
          set -e
          unzip -q Wave-Live-0.9.0-GitHub-Ready-FIXED.zip -d /tmp/wave
          ROOT=$(find /tmp/wave -maxdepth 1 -type d -name 'VYRO-Wave-commercial-0.9.0' | head -n 1)
          cp -a "$ROOT"/. .

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '9.6.0'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8 # v4.6.2
        with:
          name: wave-live-apk
          path: app/build/outputs/apk/debug/*.apk
